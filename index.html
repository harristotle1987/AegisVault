<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    
    <!-- iOS Sovereign Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AegisVault">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    
    <title>AegisVault | Sovereign Editor</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              obsidian: {
                DEFAULT: "#050505",
                soft: "#0A0A0A",
                muted: "#111111",
              },
              emerald: {
                vault: "#10B981",
                glow: "rgba(16, 185, 129, 0.15)",
              },
              vault: {
                border: "rgba(255, 255, 255, 0.08)",
                text: "#E2E8F0",
                dim: "#94A3B8",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
              serif: ["Playfair Display", "serif"],
            },
            boxShadow: {
              'sovereign': '0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05)',
              'emerald-glow': '0 0 20px rgba(16, 185, 129, 0.2)',
            },
          },
        },
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/": "https://esm.sh/react@18.2.0/",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "marked": "https://esm.sh/marked@9.1.6",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "html2canvas": "https://esm.sh/html2canvas@1.4.1",
        "docx": "https://esm.sh/docx@8.5.0",
        "file-saver": "https://esm.sh/file-saver@2.0.5",
        "dexie": "https://esm.sh/dexie@3.2.4",
        "mammoth": "https://esm.sh/mammoth@1.6.0",
        "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
        "tesseract.js": "https://esm.sh/tesseract.js@5.0.4"
      }
    }
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            background-color: #050505;
            color-scheme: dark;
        }

        body {
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            user-select: auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        #root {
          height: 100vh;
          height: 100svh;
          width: 100vw;
          position: relative;
          z-index: 1;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        body[data-font-mode="mono"] textarea,
        body[data-font-mode="mono"] .prose-vault {
           font-family: 'JetBrains Mono', monospace !important;
        }

        .vault-editor-scroll {
          overflow-y: auto !important;
          height: 100%;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
        }

        .pointer-events-none { pointer-events: none !important; }
        .pointer-events-auto { pointer-events: auto !important; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.5); }

        .prose-vault {
          user-select: text;
          pointer-events: auto;
        }
        .prose-vault h1 { 
          font-size: clamp(2.5rem, 8vw, 3.5rem); 
          font-weight: 800; 
          margin-bottom: 2.5rem; 
          color: #ffffff; 
          border-bottom: 1px solid rgba(255,255,255,0.06); 
          padding-bottom: 1rem; 
          font-family: 'Playfair Display', serif; 
          letter-spacing: -0.05em;
          line-height: 1.1;
        }
        .prose-vault h2 { 
          font-size: 2.25rem; 
          font-weight: 700; 
          margin-top: 3.5rem; 
          margin-bottom: 1.5rem; 
          color: #f8fafc; 
          font-family: 'Playfair Display', serif; 
          letter-spacing: -0.03em;
        }
        .prose-vault h3 { 
          font-size: 1.6rem; 
          font-weight: 700; 
          margin-top: 2.5rem; 
          margin-bottom: 1rem; 
          color: #f1f5f9; 
          letter-spacing: -0.02em;
        }
        .prose-vault p { 
          margin-bottom: 1.75rem; 
          line-height: 1.85; 
          color: #cbd5e1; 
          font-size: 1.15rem;
          font-weight: 400;
        }
        .prose-vault blockquote { 
          border-left: 3px solid #10b981; 
          padding: 2rem 2.5rem; 
          color: #94a3b8; 
          font-style: italic; 
          margin: 2.5rem 0; 
          background: rgba(16, 185, 129, 0.02); 
          font-size: 1.3rem;
          font-family: 'Playfair Display', serif;
        }
        .prose-vault code { 
          font-family: 'JetBrains Mono', monospace; 
          background-color: rgba(255,255,255,0.06); 
          padding: 0.2rem 0.5rem; 
          border-radius: 6px; 
          font-size: 0.85em; 
          color: #10b981; 
          font-weight: 500;
        }

        :focus:not(:focus-visible) { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
