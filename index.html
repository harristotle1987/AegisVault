<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    
    <!-- Import Map for Module Resolution -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "marked": "https://esm.sh/marked@9.1.6",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "docx": "https://esm.sh/docx@8.5.0",
        "dexie": "https://esm.sh/dexie@3.2.4",
        "mammoth": "https://esm.sh/mammoth@1.6.0",
        "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174"
      }
    }
    </script>

    <title>AegisVault | Sovereign Editor</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              obsidian: "#000000",
              emerald: {
                vault: "#10B981",
                glow: "rgba(16, 185, 129, 0.25)",
              },
              vault: {
                border: "rgba(255, 255, 255, 0.15)",
                text: "#FFFFFF",
                dim: "#CBD5E1",
              },
            }
          },
        },
      }
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            background-color: #000000 !important;
            color: #FFFFFF !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-size: 18px !important; 
            line-height: 1.6;
        }
        
        #root {
          height: 100vh;
          width: 100vw;
          display: flex;
          flex-direction: column;
        }

        .prose-vault h1 { 
          font-size: 32px !important; 
          font-weight: 800; 
          color: #ffffff; 
          margin-bottom: 1.5rem;
          border-bottom: 2px solid #10b981;
          padding-bottom: 0.5rem;
        }

        .vault-editor-scroll {
          overflow-y: auto !important;
          height: 100%;
          padding-bottom: 220px !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
