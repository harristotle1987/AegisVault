<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    
    <!-- iOS Sovereign Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AegisVault">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    
    <title>AegisVault | Sovereign Editor</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: {
                DEFAULT: "#000000",
                soft: "#050505",
                muted: "#0A0A0A",
              },
              emerald: {
                vault: "#10B981",
                glow: "rgba(16, 185, 129, 0.25)",
              },
              vault: {
                border: "rgba(255, 255, 255, 0.15)",
                text: "#FFFFFF",
                dim: "#CBD5E1",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
              serif: ["Playfair Display", "serif"],
            },
            boxShadow: {
              'sovereign': '0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1)',
              'emerald-glow': '0 0 30px rgba(16, 185, 129, 0.35)',
            },
          },
        },
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/": "https://esm.sh/react@18.2.0/",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "marked": "https://esm.sh/marked@9.1.6",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "html2canvas": "https://esm.sh/html2canvas@1.4.1",
        "docx": "https://esm.sh/docx@8.5.0",
        "file-saver": "https://esm.sh/file-saver@2.0.5",
        "dexie": "https://esm.sh/dexie@3.2.4",
        "mammoth": "https://esm.sh/mammoth@1.6.0",
        "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174"
      }
    }
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            background-color: #000000 !important;
            color: #FFFFFF !important;
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            user-select: auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            font-size: 18px; 
        }
        
        #root {
          height: 100vh;
          height: 100svh;
          width: 100vw;
          position: relative;
          z-index: 1;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        .vault-editor-scroll {
          overflow-y: auto !important;
          height: 100%;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
          padding-bottom: 200px !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }

        .prose-vault {
          user-select: text;
          pointer-events: auto;
        }
        .prose-vault h1 { 
          font-size: 32px !important; 
          font-weight: 800; 
          margin-bottom: 2rem; 
          color: #ffffff; 
          border-bottom: 2px solid #10b981; 
          padding-bottom: 1rem; 
          font-family: 'Playfair Display', serif; 
          letter-spacing: -0.05em;
          line-height: 1.1;
        }

        .prose-vault h2 { 
          font-size: 28px !important; 
          font-weight: 700; 
          margin-top: 3rem; 
          margin-bottom: 1.5rem; 
          color: #ffffff; 
          font-family: 'Playfair Display', serif; 
          letter-spacing: -0.03em;
        }

        .prose-vault p { 
          margin-bottom: 2rem; 
          line-height: 1.9; 
          color: #ffffff; 
          font-size: 18px !important;
          font-weight: 400;
        }

        .prose-vault blockquote { 
          border-left: 4px solid #10b981; 
          padding: 1.5rem 2rem; 
          color: #cbd5e1; 
          font-style: italic; 
          margin: 2rem 0; 
          background: rgba(16, 185, 129, 0.05); 
          font-size: 20px !important;
          font-family: 'Playfair Display', serif;
        }

        label {
          font-size: 14px !important;
          color: #FFFFFF !important;
          font-weight: 700 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
