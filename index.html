    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AegisVault">
    
    <title>AegisVault | Sovereign Editor</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: { DEFAULT: "#000000", soft: "#050505", muted: "#0A0A0A" },
              emerald: { vault: "#10B981", glow: "rgba(16, 185, 129, 0.25)" },
              vault: { border: "rgba(255, 255, 255, 0.15)", text: "#FFFFFF", dim: "#CBD5E1" }
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
              serif: ["Playfair Display", "serif"]
            },
            boxShadow: {
              'sovereign': '0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1)',
              'emerald-glow': '0 0 30px rgba(16, 185, 129, 0.35)'
            }
          }
        }
      }
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            background-color: #000000;
            color: #FFFFFF;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            font-size: 18px !important;
        }
        #root { height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
        .vault-editor-scroll { overflow-y: auto !important; padding-bottom: 220px !important; }
        .prose-vault h1 { font-size: 32px !important; color: #10B981; font-weight: 800; margin-bottom: 2rem; text-transform: uppercase; border-bottom: 2px solid #10b981; padding-bottom: 1rem; }
        .prose-vault h2 { font-size: 32px !important; color: #10B981; font-weight: 700; margin-top: 3rem; margin-bottom: 1.5rem; }
        .prose-vault p { font-size: 18px !important; color: #FFFFFF; margin-bottom: 2rem; line-height: 1.9; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
